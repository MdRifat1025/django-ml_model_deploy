<!DOCTYPE html>
<html>
<head>
    <title>ML Prediction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card shadow">
                <div class="card-body">
                    <h4 class="text-center mb-3">ML Model Prediction</h4>

                    <form method="POST">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label>Feature 1</label>
                            <input type="number" step="any" name="f1" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label>Feature 2</label>
                            <input type="number" step="any" name="f2" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label>Feature 3</label>
                            <input type="number" step="any" name="f3" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label>Feature 4</label>
                            <input type="number" step="any" name="f4" class="form-control" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            Predict
                        </button>
                    </form>

                    {% if prediction is not None %}
                        <div class="alert alert-success mt-3 text-center">
                            <strong>Prediction:</strong> {{ prediction }}
                        </div>
                    {% endif %}
                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
